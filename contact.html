    <main>
        <div class="container2">
            <h2>Επικοινώνησε μαζί μου</h2>

            <form id="contactForm">
                <label>Email</label>
                <input type="text" id="email">

                <label>Όνομα</label>
                <input type="text" id="name">

                <label>Μήνυμα</label>
                <textarea id="message"></textarea>
                <div class="char-count"><span id="chars">0</span>/100 χαρακτήρες</div>

                <p class="error" id="errorMsg"></p>
                <button type="submit">Αποστολή</button>
            </form>
            <div class="success" id="successMsg">Το μήνυμα στάλθηκε με επιτυχία!</div>
        </div>

    </main>
<script src="contact.js"></script>
